<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Registrieren | Zoicas &amp; Osinski</title><link rel="stylesheet" href="../Css/cinematic.css"><script src="../js/customer-register.js" defer></script></head><body class="service-page"><header class="site-header"><div class="header-inner"><a href="kundenportal.html" class="brand"><img src="../assets/images/Logo/zoicas-osinski.svg" alt="Zoicas & Osinski"></a></div></header><main class="portal-shell"><section class="portal-auth portal-single"><div class="portal-card"><a class="portal-back" href="kundenportal.html">← Zum Kundenportal</a><p class="portal-card-kicker">NEUES KUNDENKONTO</p><h1>Konto <span>erstellen.</span></h1><p>Ihre Daten werden ausschließlich für Ihren persönlichen Bereich verwendet.</p><form id="customer-register"><label>Vorname<input name="first_name" autocomplete="given-name" required></label><label>Nachname<input name="last_name" autocomplete="family-name" required></label><label>E-Mail<input name="email" type="email" autocomplete="email" required></label><label>Telefon<input name="phone" type="tel" autocomplete="tel" required></label><label>Passwort<input name="password" type="password" minlength="12" autocomplete="new-password" required></label><label>Passwort bestätigen<input name="password_confirmation" type="password" minlength="12" autocomplete="new-password" required></label><button class="button button-primary">Konto erstellen <span>→</span></button></form><p id="portal-note" class="form-note" role="status"></p><a class="portal-secondary-link" href="kunden-anmelden.html">Bereits registriert? Anmelden</a></div></section></main></body></html>
