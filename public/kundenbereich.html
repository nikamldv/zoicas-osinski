<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Kundenbereich | Zoicas &amp; Osinski</title>
    <link rel="stylesheet" href="../Css/cinematic.css">
</head>
<body class="service-page">
    <main class="portal-shell">
        <section id="customer-dashboard" class="portal-dashboard">
            <aside>
                <a class="brand" href="../index.html#home"><img src="../assets/images/Logo/zoicas-osinski.svg" alt="Zoicas &amp; Osinski"></a>
                <strong id="portal-name">Kundenportal</strong>
                <button data-portal-view="home" class="is-active">Dashboard</button>
                <button data-portal-view="appointments">Termine</button>
                <button data-portal-view="quotes">Angebote</button>
                <button data-portal-view="orders">Meine Aufträge</button>
                <button data-portal-view="invoices">Rechnungen</button>
                <button data-portal-view="profile">Mein Profil</button>
                <span>Dokumente · Nachrichten<br><small>Demnächst verfügbar</small></span>
                <button id="customer-logout">Abmelden</button>
            </aside>
            <div class="portal-content"><h1 id="portal-title">Willkommen zurück</h1><p id="portal-description">Ihre verknüpften Informationen sehen Sie hier.</p><div id="portal-data" class="portal-data"></div></div>
        </section>
    </main>
    <script src="../js/customer-dashboard.js" defer></script>
</body>
</html>
