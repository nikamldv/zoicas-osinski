<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>Kundenbereich | Zoicas &amp; Osinski</title><script src="../js/portal-theme-init.js" data-portal-theme="customer"></script>
    <link rel="stylesheet" href="../Css/cinematic.css">
<link rel="stylesheet" href="../Css/dashboard-home.css"><link rel="stylesheet" href="../Css/customer-premium.css"><script src="../js/customer-shell.js" defer></script><link rel="stylesheet" href="../Css/portal-polish.css"></head>
<body class="service-page customer-app">
    <header class="customer-top"><a href="kundenportal.html"><img src="../assets/images/Logo/zoicas-osinski.png" alt="Zoicas &amp; Osinski"></a><button id="customer-theme" class="customer-theme" type="button" aria-label="Dunkles Design" aria-pressed="false"><span aria-hidden="true">◐</span></button></header>
    <main class="portal-shell">
        <section id="customer-boot" class="customer-notice"><p id="customer-boot-message" role="status">Kundenportal wird geladen …</p><button id="customer-boot-retry" type="button" class="button button-light" hidden>Erneut versuchen</button></section>
        <section id="customer-dashboard" class="portal-dashboard" hidden>
<nav class="customer-bottom" aria-label="Mobile Navigation"><button data-customer-tab="home" type="button"><span aria-hidden="true">⌂</span>Übersicht</button><button data-customer-tab="appointments" type="button"><span aria-hidden="true">▦</span>Termine</button><button data-customer-tab="invoices" type="button"><span aria-hidden="true">€</span>Rechnungen</button><button id="customer-menu-toggle" type="button" aria-expanded="false" aria-haspopup="dialog" aria-controls="customer-menu"><span aria-hidden="true">⋯</span>Mehr</button></nav>
            <dialog id="customer-menu" class="customer-menu" aria-label="Weitere Bereiche"><button id="customer-menu-close" class="customer-menu-close" type="button">Menü schließen</button></dialog>
            <aside id="customer-rail" class="customer-rail" aria-label="Kundennavigation">
                <strong id="portal-name">Kundenportal</strong>
                <button data-portal-view="home" class="is-active">Übersicht</button>
<p class="customer-nav-group">Mein Service</p><button data-portal-view="appointments">Meine Termine</button>
<button data-portal-view="orders">Meine Leistungen</button>
<button data-portal-view="service-reports">Leistungsnachweise</button>
<button data-portal-view="service-requests">Serviceanfragen</button>
<button data-portal-view="complaints">Beschwerden</button>
<p class="customer-nav-group">Unterlagen</p><button data-portal-view="contracts" type="button">Meine Verträge</button>
<button data-portal-view="quotes">Meine Angebote</button>
<button data-portal-view="invoices">Meine Rechnungen</button>
<button data-portal-view="documents">Meine Dokumente</button>
<p class="customer-nav-group">Konto &amp; Kontakt</p><button data-portal-view="messages">Nachrichten</button>
<button data-portal-view="notifications">Benachrichtigungen</button>
<button data-portal-view="profile">Mein Profil</button>
<button id="customer-logout">Abmelden</button>
            </aside>
            <div class="portal-content"><h1 id="portal-title" tabindex="-1">Willkommen zurück</h1><p id="portal-description" role="status" aria-live="polite">Ihre verknüpften Informationen sehen Sie hier.</p><section id="customer-view-status" class="customer-notice" hidden><p id="customer-view-message" role="status"></p><span id="customer-view-skeleton" class="customer-skeleton" aria-hidden="true"></span><button id="customer-view-retry" class="button button-light" type="button" hidden>Erneut versuchen</button></section><div id="portal-data" class="portal-data"></div><section id="customer-summary" class="customer-summary" aria-label="Weitere Kennzahlen" hidden></section><section id="customer-quick" class="customer-extra-card" hidden><h2>Schnellzugriff</h2><div class="customer-quick-list"><button data-customer-go="service-requests" type="button" class="button button-light">Service anfragen</button><button data-customer-go="appointments" type="button" class="button button-light">Meine Termine ansehen</button><button data-customer-go="invoices" type="button" class="button button-light">Rechnungen ansehen</button><button data-customer-go="documents" type="button" class="button button-light">Dokumente ansehen</button><button data-customer-go="complaints" type="button" class="button button-light">Beschwerde einreichen</button><button data-customer-go="messages" type="button" class="button button-light">Kontakt aufnehmen</button><a id="customer-quick-invoice" class="button button-light" hidden>Rechnung herunterladen</a></div></section></div>
        </section>
    </main>
     <script src="../js/dashboard-home.js" defer></script><script src="../js/customer-dashboard.js" defer></script>
</body>
</html>
